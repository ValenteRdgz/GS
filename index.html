<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Robos - Residencial Gran Segovia</title>
    <!-- SheetJS para exportar a Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --primary-color: #4A2323;
            --accent-color: #B2A296;
            --bg-color: #F8F6F4;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --border-color: #D3CBC4;
            --danger-color: #8B0000;
            --success-color: #2E7D32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border-bottom: 4px solid var(--primary-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .logo-img {
            max-width: 180px;
            height: auto;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 0.95rem;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
            background-color: rgba(74, 35, 35, 0.05);
        }

        .tab-content {
            display: none;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--primary-color);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #361919;
        }

        .btn-secondary {
            background-color: var(--accent-color);
            color: #333;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #9d8d81;
        }

        .alert {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.85rem;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .table-responsive {
            overflow-x: auto;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="Gran_Segovia_Logo.png" alt="Gran Segovia Logo" class="logo-img" onerror="this.style.display='none'">
        <h1>Bitácora de Análisis de Robos e Incidencias</h1>
        <p class="subtitle">Residencial Gran Segovia</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('vecinoTab')">Registro Vecino</button>
        <button class="tab-btn" onclick="switchTab('adminTab')">Superusuario</button>
    </div>

    <!-- VISTA VECINO -->
    <div id="vecinoTab" class="tab-content active">
        <div id="vecinoAlert" class="alert"></div>
        <form id="incidenciaForm" onsubmit="guardarIncidencia(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="fecha">Fecha del Suceso</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label for="hora">Hora Aproximada</label>
                    <input type="time" id="hora" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Nombre(s)" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" placeholder="Apellido(s)" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="calle">Calle</label>
                    <select id="calle" required>
                        <option value="">Seleccione su calle...</option>
                        <option value="Av. Almenar">Av. Almenar</option>
                        <option value="Calle Segovia">Calle Segovia</option>
                        <option value="Calle Alcázar">Calle Alcázar</option>
                        <option value="Calle Toledo">Calle Toledo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="numero">Número de Vivienda</label>
                    <input type="text" id="numero" placeholder="Ej. 1040" required onchange="verificarVivienda()">
                </div>
            </div>

            <div class="form-group">
                <label for="objetos">Objetos o Bienes Sustraídos</label>
                <textarea id="objetos" rows="3" placeholder="Describa detalladamente los objetos robados..." required></textarea>
            </div>

            <div class="form-group">
                <label for="recuperados">¿Se recuperó algún objeto?</label>
                <select id="recuperados" required>
                    <option value="">Seleccione una opción...</option>
                    <option value="No">No, nada recuperado</option>
                    <option value="Parcialmente">Parcialmente</option>
                    <option value="Sí, totalmente">Sí, totalmente</option>
                </select>
            </div>

            <div class="form-group">
                <label for="vulnerabilidad">Punto de Vulnerabilidad Identificado</label>
                <input type="text" id="vulnerabilidad" placeholder="Ej. Portón trasero, ventana de patio, etc." required>
            </div>

            <!-- CAMPO ACTUALIZADO -->
            <div class="form-group"> 
                <label for="areaRefuerzo">Área / Punto de Refuerzo Recomendado</label> 
                <select id="areaRefuerzo" onchange="toggleOtroAreaRefuerzo()" required> 
                    <option value="">Seleccione el área que requiere mayor vigilancia/mejora...</option>
                    <option value="Accesos peatonales / Controles de acceso">Accesos peatonales / Controles de acceso</option>
                    <option value="Barda perimetral / Cerco eléctrico">Barda perimetral / Cerco eléctrico</option> 
                    <option value="Iluminación exterior">Iluminación exterior</option>
                    <option value="Rondines de vigilancia / Patrullaje">Rondines de vigilancia / Patrullaje</option> 
                    <option value="Cámaras de circuito cerrado (CCTV)">Cámaras de circuito cerrado (CCTV)</option>
                    <option value="Control de proveedores y repartidores">Control de proveedores y repartidores</option>
                    <option value="Control y registro de personal">Control y registro de personal</option> 
                    <option value="Mejor Control de Acceso vehicular">Mejor Control de Acceso vehicular</option> 
                    <option value="Otro">Otro (Especificar)</option>
                </select> 
            </div>

            <div class="form-group hidden" id="grupoOtroArea">
                <label for="otroAreaRefuerzo">Especificar Área / Punto de Refuerzo</label>
                <input type="text" id="otroAreaRefuerzo" placeholder="Describa el área de refuerzo recomendada...">
            </div>

            <button type="submit" class="btn">Registrar Reporte</button>
        </form>
    </div>

    <!-- VISTA SUPERUSUARIO -->
    <div id="adminTab" class="tab-content">
        <div id="adminAuthForm">
            <h2 style="color: var(--primary-color); margin-bottom: 15px;">Acceso de Administración</h2>
            <div id="adminAlert" class="alert"></div>
            <div class="form-group">
                <label for="adminUser">Usuario</label>
                <input type="text" id="adminUser" placeholder="Ingrese su usuario">
            </div>
            <div class="form-group">
                <label for="adminPass">Contraseña</label>
                <input type="password" id="adminPass" placeholder="Ingrese su contraseña">
            </div>
            <button class="btn" onclick="autenticarAdmin()">Ingresar al Dashboard</button>
        </div>

        <div id="adminDashboard" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Panel Global de Incidencias</h2>
                <button class="btn" style="width: auto; background-color: #555;" onclick="cerrarSesionAdmin()">Cerrar Sesión</button>
            </div>
            
            <button class="btn btn-secondary" onclick="exportarExcel()">📥 Descargar Reporte Completo en Excel</button>
            
            <div class="table-responsive" style="margin-top: 20px;">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Vecino</th>
                            <th>Domicilio</th>
                            <th>Objetos Sustraídos</th>
                            <th>Recuperado</th>
                            <th>Vulnerabilidad</th>
                            <th>Área Refuerzo</th>
                        </tr>
                    </thead>
                    <tbody id="tablaIncidenciasBody">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function toggleOtroAreaRefuerzo() {
        const select = document.getElementById('areaRefuerzo');
        const grupoOtro = document.getElementById('grupoOtroArea');
        const inputOtro = document.getElementById('otroAreaRefuerzo');
        
        if (select.value === 'Otro') {
            grupoOtro.classList.remove('hidden');
            inputOtro.required = true;
        } else {
            grupoOtro.classList.add('hidden');
            inputOtro.required = false;
            inputOtro.value = '';
        }
    }

    async function verificarVivienda() {
        const calle = document.getElementById('calle').value;
        const numero = document.getElementById('numero').value;

        if (!calle || !numero) return;

        try {
            const { data, error } = await supabaseClient.rpc('obtener_ultimo_registro_vivienda', {
                p_calle: calle,
                p_numero: numero
            });

            if (data && data.length > 0) {
                document.getElementById('nombre').value = data[0].nombre;
                document.getElementById('apellido').value = data[0].apellido;
            }
        } catch (err) {
            console.log('Error verificando vivienda:', err);
        }
    }

    async function guardarIncidencia(e) {
        e.preventDefault();
        const alertEl = document.getElementById('vecinoAlert');

        let areaFinal = document.getElementById('areaRefuerzo').value;
        if (areaFinal === 'Otro') {
            areaFinal = document.getElementById('otroAreaRefuerzo').value;
        }

        const payload = {
            p_fecha: document.getElementById('fecha').value,
            p_hora: document.getElementById('hora').value,
            p_nombre: document.getElementById('nombre').value,
            p_apellido: document.getElementById('apellido').value,
            p_calle: document.getElementById('calle').value,
            p_numero: document.getElementById('numero').value,
            p_objetos: document.getElementById('objetos').value,
            p_recuperados: document.getElementById('recuperados').value,
            p_vulnerabilidad: document.getElementById('vulnerabilidad').value,
            p_area_refuerzo: areaFinal
        };

        try {
            const { data, error } = await supabaseClient.rpc('insertar_incidencia', payload);

            if (error) throw error;

            alertEl.className = 'alert alert-success';
            alertEl.textContent = '¡Reporte registrado correctamente en la base centralizada!';
            alertEl.style.display = 'block';

            document.getElementById('incidenciaForm').reset();
            toggleOtroAreaRefuerzo();
            setTimeout(() => { alertEl.style.display = 'none'; }, 4000);
        } catch (err) {
            alertEl.className = 'alert alert-danger';
            alertEl.textContent = 'Error al registrar el reporte. Por favor intente nuevamente.';
            alertEl.style.display = 'block';
            console.error(err);
        }
    }

    async function autenticarAdmin() {
        const user = document.getElementById('adminUser').value;
        const pass = document.getElementById('adminPass').value;
        const alertEl = document.getElementById('adminAlert');

        try {
            const { data, error } = await supabaseClient.rpc('obtener_todas_incidencias', {
                p_admin_user: user,
                p_admin_pass: pass
            });

            if (error || !data) throw new Error('Credenciales incorrectas');

            document.getElementById('adminAuthForm').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');

            renderTablaAdmin(data);
        } catch (err) {
            alertEl.className = 'alert alert-danger';
            alertEl.textContent = 'Usuario o contraseña de administración incorrectos.';
            alertEl.style.display = 'block';
        }
    }

    function renderTablaAdmin(incidencias) {
        const tbody = document.getElementById('tablaIncidenciasBody');
        tbody.innerHTML = '';

        if (incidencias.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No hay incidencias registradas.</td></tr>';
            return;
        }

        incidencias.forEach(inc => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${inc.fecha}</td>
                <td>${inc.hora}</td>
                <td>${inc.nombre} ${inc.apellido}</td>
                <td>${inc.domicilio}</td>
                <td>${inc.objetos}</td>
                <td>${inc.recuperados}</td>
                <td>${inc.vulnerabilidad}</td>
                <td>${inc.area_refuerzo}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function cerrarSesionAdmin() {
        document.getElementById('adminUser').value = '';
        document.getElementById('adminPass').value = '';
        document.getElementById('adminAuthForm').classList.remove('hidden');
        document.getElementById('adminDashboard').classList.add('hidden');
    }

    async function exportarExcel() {
        const user = document.getElementById('adminUser').value;
        const pass = document.getElementById('adminPass').value;

        const { data } = await supabaseClient.rpc('obtener_todas_incidencias', {
            p_admin_user: user,
            p_admin_pass: pass
        });

        if (!data) return;

        const dataExcel = data.map(item => ({
            'Fecha': item.fecha,
            'Hora': item.hora,
            'Nombre': item.nombre,
            'Apellido': item.apellido,
            'Domicilio': item.domicilio,
            'Objetos Sustraídos': item.objetos,
            'Recuperado': item.recuperados,
            'Vulnerabilidad': item.vulnerabilidad,
            'Área de Refuerzo': item.area_refuerzo
        }));

        const ws = XLSX.utils.json_to_sheet(dataExcel);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Incidencias");
        XLSX.writeFile(wb, `Incidencias_Gran_Segovia_${new Date().toISOString().split('T')[0]}.xlsx`);
    }
</script>

</body>
</html>
